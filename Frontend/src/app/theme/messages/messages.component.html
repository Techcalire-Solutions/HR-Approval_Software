<button mat-icon-button [matMenuTriggerFor]="messagesMenu" (click)="openMessagesMenu()" style="position: relative;">
  <mat-icon>notifications</mat-icon>
  
  @if (unreadCount > 0) {
    <span class="notification-badge">
      {{ unreadCount }}
    </span>
  }
</button>

<mat-menu #messagesMenu="matMenu" [overlapTrigger]="false" class="custom-messages-menu">
  <div class="menu-container" (click)="stopClickPropagate($event)">
    <mat-tab-group class="primary-tabs" [selectedIndex]="selectedTab">
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon>message</mat-icon>&nbsp;&nbsp;Messages
        </ng-template>
    

        
        <div class="notification-list-wrapper">
        <br>
    
          @for (message of notifications; track message.id) {
            <button mat-button (click)="navigateToMessage(message)" class="notification-item">
              <div class="notification-content">
                <div class="notification-header">
                  <span class="name">{{ message.name }}</span>
                  <span class="info">
                    <mat-icon class="time-icon">access_time</mat-icon> {{ message.createdAt | timeAgo }}
                  </span>
                </div>
                
                <!-- Renders perfectly left-aligned with a balanced text structure -->
                <span class="text muted-text" [innerHTML]="message.message"></span>
              </div>

              <mat-icon class="status-icon"
                        [ngStyle]="{'color': message.isRead ? '#3f51b5' : '#4caf50'}"
                        (click)="stopClickPropagate($event); !isAdmin() ? markAsRead(message.id) : null"
                        aria-label="Mark as read">
                mark_email_read
              </mat-icon>
            </button>
          } @empty {
            <div class="empty-state">No notifications found.</div>
          }
        </div>

        <!-- Premium Paginator Base -->
        <div class="paginator-footer">
          <mat-paginator 
            [length]="totalCount"
            [pageSize]="pageSize"
            [pageIndex]="currentPage - 1"
            [pageSizeOptions]="[5, 10, 15]"
            (page)="onPageChange($event)"
            showFirstLastButtons>
          </mat-paginator>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</mat-menu>
