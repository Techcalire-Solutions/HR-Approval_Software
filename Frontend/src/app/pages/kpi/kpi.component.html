<div class="container">
  <h2>KPI Points by Designation</h2>
  
  <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

  <mat-card *ngIf="errorMessage" class="error-card">
    <mat-card-content>
      <div class="error-message">{{ errorMessage }}</div>
    </mat-card-content>
  </mat-card>

  <mat-accordion displayMode="flat" multi>
    <mat-expansion-panel *ngFor="let designation of designations">
      <mat-expansion-panel-header>
        <mat-panel-title>
          {{ designation.designationName }}
        </mat-panel-title>
      </mat-expansion-panel-header>

      <mat-table [dataSource]="dataSources[designation.id]">
        <!-- KPI Parameter Column -->
        <ng-container matColumnDef="parameter">
          <mat-header-cell *matHeaderCellDef> KPI Parameter </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{ element.kpi?.parameter }} </mat-cell>
        </ng-container>

        <!-- Points Column -->
        <ng-container matColumnDef="points">
          <mat-header-cell *matHeaderCellDef> Points </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{ element.points || 0 }} </mat-cell>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
          <mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="openEditDialog(element)">
              <mat-icon>edit</mat-icon>
            </button>
          </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>
    </mat-expansion-panel>
  </mat-accordion>
</div>
